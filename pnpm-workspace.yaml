packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  unrs-resolver: false
# Bind packages that reference React declarations to their consumer's React types.
packageExtensions:
  framer-motion:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  next:
    peerDependencies:
      '@types/react': '*'
      '@types/react-dom': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
      '@types/react-dom':
        optional: true
